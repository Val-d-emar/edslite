name: Android CI

on:
  pull_request:
    branches: ["dev", "main", "feat/*"] # Добавил feat/* для тестов
  workflow_dispatch:

jobs:
  # --- ЭТАП 1: СБОРКА ПРОЕКТА ---
  build:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # могут быть сабмодули

      # Шаг 2: Установка Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # Шаг 3: Настройка кэширования Gradle (ускоряет сборку)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Версия gradle берется из gradle-wrapper.properties в проекте
          # Кэширование включено автоматически
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Шаг 4: Делаем gradlew исполняемым
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Шаг 5: Сборка Debug APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Шаг 6: Сборка Release APK (по желанию, можно отключить для PR)
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # --- ДИАГНОСТИКА (если сборка упадет, увидим, где лежат файлы) ---
      - name: List build outputs
        if: always()
        run: ls -R app/build/outputs/apk/ || true

      # Шаг 7: Загрузка APK как артефакта
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edslite-build
          path: app/build/outputs/apk/**/*.apk

  # --- ЭТАП 2: ОТЧЕТ В PULL REQUEST ---
  report:
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Generate workflow run URL
        id: run-url
        run: echo "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Post success comment
        if: needs.build.result == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: build-report
          message: |
            ✅ **Сборка прошла успешно!**

            - **Скачать APK:** [edslite-build.zip](${{ steps.run-url.outputs.url }})

      - name: Post failure comment
        if: needs.build.result == 'failure'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: build-report
          message: |
            ❌ **Сборка провалилась.**

            - **Логи:** [GitHub Actions Log](${{ steps.run-url.outputs.url }})
