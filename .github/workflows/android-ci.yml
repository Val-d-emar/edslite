name: Android CI

on:
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    # Используем старую версию Ubuntu, которая нативно поддерживает libncurses5
    runs-on: ubuntu-20.04

    steps:
      # Шаг 1: Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Install required dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libncurses5

      # Шаг 2: Установка Java (JDK)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '5.6.4'    

      # Шаг 3: Кеширование NDK
      # Этот шаг попытается восстановить NDK из кеша GitHub
      - name: Cache NDK
        id: cache-ndk # Даем шагу id, чтобы ссылаться на его результат
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-r13b
          key: ndk-r13b-${{ runner.os }}

      # Шаг 4: Скачивание NDK, если его нет в кеше
      # Этот шаг выполнится только если предыдущий шаг не нашел кеш
      - name: Download and extract NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r13b-linux-x86_64.zip
          unzip -q android-ndk-r13b-linux-x86_64.zip -d $HOME
          
      # Шаг 5: Создание файла local.properties
      # Этот шаг выполняется всегда, чтобы прописать путь к NDK (скачанному или из кеша)
      - name: Create local.properties
        run: echo "ndk.dir=$HOME/android-ndk-r13b" > local.properties              
                
      # Шаг 5: Сборка debug APK
      # Запускаем задачу 'assembleDebug', которая создает неподписанный APK.
      - name: Build with Gradle
        run: gradle :app:assembleLiteLicCheckNoneNoinetNofsmlDebug || exit 0
        # опции для ускорения
        # run: gradle assembleLiteDebug --no-daemon --parallel

      - name: List available tasks
        if: always()
        run: gradle :app:tasks || exit 0

      # Шаг 6: Загрузка APK как артефакта
      # Находим собранный APK и загружаем его с помощью action 'upload-artifact'.
      # После этого его можно будет скачать со страницы workflow.
      - name: Upload APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          # Имя артефакта, который можно скачать со страницы workflow
          name: preview-eds-apk
          # Путь к файлу APK. Стандартный путь для debug-сборки.
          path: app/build/outputs/apk/lite/licCheckNone/noinet/nofsml/debug/*.apk

