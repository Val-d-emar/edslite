apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

android {
    namespace 'com.sovworks.eds.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sovworks.eds.android'
        minSdkVersion 24
        targetSdkVersion 35

        versionCode 238
        versionName '2.0.0.238'
        multiDexEnabled true

        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                targets 'edsxts', 'edsctr', 'edsaes', 'edsserpent', 'edstwofish',
                        'edsripemd160', 'edswhirlpool', 'localxts', 'edscfb',
                        'edscbc', 'edsgost', 'edsexfat'

                // Флаг для корректной работы C++
                cppFlags '-std=c++17'
            }
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Указываем явную версию NDK, если Gradle сам не подтянет
    // ndkVersion = "25.1.8937393"

    signingConfigs {
        debug {
            storeFile file('../misc/keys.keystore')
            storePassword 'android'
            keyAlias 'eds-debug-key'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true // Можно временно поставить false, если будут ошибки R8/Proguard
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }

        debug {
            signingConfig signingConfigs.debug
            externalNativeBuild {
                cmake {
                    cFlags '-DDEBUG'
                }
            }
            debuggable true
            jniDebuggable true
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE']
        }
    }

    // Новый блок lint для Gradle 8+
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // Автоматическое переименование APK
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "EDS-Lite-${variant.buildType.name}-v${variant.versionName}.apk"
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1' // Или версия, установленная в CI
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX & Material
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RxJava 3
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    // RxLifecycle (Устарело, но оставляем для совместимости с кодом)
    implementation 'com.trello.rxlifecycle3:rxlifecycle:3.1.0'
    implementation 'com.trello.rxlifecycle3:rxlifecycle-android:3.1.0'
    implementation 'com.trello.rxlifecycle3:rxlifecycle-components:3.1.0'

    // Modules
    implementation project(':library')   // IJKPlayer
    implementation project(':photoview') // PhotoView

    // Logging
    api 'com.jakewharton.timber:timber:5.0.1'
    api 'com.orhanobut:logger:2.2.0'

    // Images
    // implementation 'com.github.stfalcon-studio:StfalconImageViewer:v1.0.1'
    // implementation 'com.github.stfalcon:stfalcon-imageviewer:1.0.1'
    implementation(group: 'com.github.stfalcon', name: 'stfalcon-imageviewer', version: '1.0.1') {
        exclude group: 'com.github.chrisbanes', module: 'PhotoView'
    }
    implementation 'com.github.WenHuayu:GlidePlaceholderDrawable:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Utils
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50' // Обновил версию чуть-чуть
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation('com.github.junrar:junrar:7.5.5')

    // UI Bars
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    implementation 'com.geyifeng.immersionbar:immersionbar-ktx:3.2.2'

    // Media
    implementation 'com.drewnoakes:metadata-extractor:2.18.0'
    // нужна для аннотаций @NotNull из той же либы
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
