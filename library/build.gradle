plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'androidx.ijk'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'

    implementation 'androidx.core:core-ktx:1.10.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Явно подключаем IJKPlayer для ВСЕХ архитектур
    def ijkVersion = "0.8.8"
    // Основная Java-часть
    api "tv.danmaku.ijk.media:ijkplayer-java:$ijkVersion"
    // Нативные библиотеки для разных процессоров
    api "tv.danmaku.ijk.media:ijkplayer-armv7a:$ijkVersion"
    api "tv.danmaku.ijk.media:ijkplayer-arm64:$ijkVersion"
    api "tv.danmaku.ijk.media:ijkplayer-x86:$ijkVersion"
    api "tv.danmaku.ijk.media:ijkplayer-x86_64:$ijkVersion"
}